<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #setup { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
    input, button {
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #111;
    }
    button { background: #111; color: #fff; border-color: #111; cursor: pointer; }
    button:hover { background: #333; }
    #timer {
      display: none;
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      /* 9rem escala con el zoom del navegador; 23vw es el tope para que quepa en pantalla */
      font-size: min(9rem, 23vw);
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
    }
    #timer small { display: block; font-size: 0.9rem; color: #999; letter-spacing: 0.1em; margin-top: 8px; }
    canvas { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <form id="setup">
    <input id="date" type="date" required>
    <input id="time" type="time" step="1" required>
    <button type="submit">Comenzar</button>
  </form>

  <div id="timer"><span id="digits">00:00:00</span><small id="label"></small></div>

  <canvas id="confetti"></canvas>

  <script>
    const $ = id => document.getElementById(id);
    const setup = $('setup'), timer = $('timer'), digits = $('digits'), label = $('label');
    let target, tick;

    const pad = n => String(n).padStart(2, '0');

    function render() {
      const ms = Math.max(0, target - Date.now());
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const hms = `${pad(Math.floor(s / 3600) % 24)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
      digits.textContent = d > 0 ? `${d}d ${hms}` : hms;
      digits.style.fontSize = d > 0 ? 'min(1em, 17vw)' : ''; // con días el texto es más largo
      if (ms === 0) {
        clearInterval(tick);
        confetti();
      }
    }

    function start(t) {
      target = t;
      setup.style.display = 'none';
      timer.style.display = 'block';
      label.textContent = new Date(t).toLocaleString('es', { dateStyle: 'long', timeStyle: 'short' });
      render();
      tick = setInterval(render, 250);
    }

    setup.addEventListener('submit', e => {
      e.preventDefault();
      const t = new Date(`${$('date').value}T${$('time').value}`).getTime();
      if (isNaN(t)) return;
      location.hash = t; // permite recargar o compartir el link
      start(t);
    });

    // Valores por defecto: ahora + 1 minuto
    const now = new Date(Date.now() + 60000);
    $('date').value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    $('time').value = `${pad(now.getHours())}:${pad(now.getMinutes())}:00`;

    // Si viene un objetivo en el link (#timestamp), arrancar directo
    const fromHash = Number(location.hash.slice(1));
    if (fromHash) start(fromHash);

    // Challas
    function confetti() {
      const c = $('confetti'), ctx = c.getContext('2d');
      const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff924c'];
      c.width = innerWidth; c.height = innerHeight;
      const pieces = Array.from({ length: 220 }, () => ({
        x: Math.random() * c.width,
        y: -20 - Math.random() * c.height,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vx: -1.5 + Math.random() * 3,
        vy: 2 + Math.random() * 3,
        r: Math.random() * Math.PI,
        vr: -0.15 + Math.random() * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
      (function frame() {
        ctx.clearRect(0, 0, c.width, c.height);
        let alive = false;
        for (const p of pieces) {
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y < c.height + 20) alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r)));
          ctx.restore();
        }
        if (alive) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, c.width, c.height);
      })();
    }
  </script>
</body>
</html>
